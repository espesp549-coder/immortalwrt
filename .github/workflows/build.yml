name: Build ImmortalWrt 23.05.0 - 360T6M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. Checkout source
      # =========================================================
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 23.05.0
          fetch-depth: 1

      # =========================================================
      # 2. Install build dependencies
      # =========================================================
      - name: Install Build Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time

      # =========================================================
      # 3. Check source and DTS
      # =========================================================
      - name: Check Source and DTS
        run: |
          set -e

          echo "========================================"
          echo "SOURCE"
          echo "========================================"

          git branch --show-current
          git rev-parse HEAD

          echo
          echo "========================================"
          echo "CHECK 360T6M DTS"
          echo "========================================"

          DTS="target/linux/ramips/dts/mt7621_qihoo_360t6m.dts"

          if [ ! -f "$DTS" ]; then
            echo "ERROR: DTS not found:"
            echo "$DTS"

            echo
            echo "Searching for 360T6M DTS:"
            find target/linux/ramips/dts \
              -type f \
              \( -iname '*360*' -o -iname '*t6m*' -o -iname '*qihoo*' \) \
              -print || true

            exit 1
          fi

          echo "DTS FOUND:"
          ls -lh "$DTS"

          echo
          echo "========================================"
          echo "DTS DEVICE"
          echo "========================================"

          grep -n -E \
            'compatible|model|360|T6M' \
            "$DTS" || true

          echo
          echo "========================================"
          echo "DTS PCIe"
          echo "========================================"

          grep -n -A100 -B10 \
            'pcie@1e140000' \
            "$DTS" || true

      # =========================================================
      # 4. Update feeds
      # =========================================================
      - name: Update Feeds
        run: |
          set -e

          ./scripts/feeds update -a

      # =========================================================
      # 5. Install only required feed packages
      # =========================================================
      - name: Install Required Feed Packages
        run: |
          set -e

          ./scripts/feeds install base
          ./scripts/feeds install luci
          ./scripts/feeds install packages
          ./scripts/feeds install kernel

      # =========================================================
      # 6. Create configuration
      # =========================================================
      - name: Configure 360T6M
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y

          CONFIG_LEGACY_IMAGE_FORMAT=y

          # =====================================================
          # UBI / UBIFS
          # =====================================================

          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y

          # =====================================================
          # TPROXY / TUN
          # =====================================================

          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y

          # =====================================================
          # MediaTek WiFi / MT7915
          # =====================================================

          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_wpad-openssl=y

          # =====================================================
          # Basic packages
          # =====================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_dropbear=y

          # =====================================================
          # Kernel / Initramfs support
          # =====================================================

          CONFIG_TARGET_INITRAMFS_COMPRESSION_GZIP=y
          EOF

          echo
          echo "========================================"
          echo "MAKE DEFCONFIG"
          echo "========================================"

          make defconfig

      # =========================================================
      # 7. Verify configuration
      # =========================================================
      - name: Verify Configuration
        run: |
          set -e

          echo
          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep -E '^CONFIG_TARGET_' .config || true

          echo
          echo "========================================"
          echo "360T6M"
          echo "========================================"

          grep \
            '^CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=' \
            .config || true

          echo
          echo "========================================"
          echo "UBI / UBIFS"
          echo "========================================"

          grep -E \
            '^CONFIG_MTD_UBI=|^CONFIG_MTD_UBI_BEB_LIMIT=|^CONFIG_MTD_UBI_FASTMAP=|^CONFIG_UBIFS_FS=' \
            .config || true

          echo
          echo "========================================"
          echo "TPROXY / TUN"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_kmod-nft-tproxy=|^CONFIG_PACKAGE_kmod-tun=|^CONFIG_PACKAGE_iptables-nft=|^CONFIG_NETFILTER_XT_TARGET_TPROXY=|^CONFIG_NETFILTER_XT_MATCH_SOCKET=|^CONFIG_NF_CONNTRACK_MARK=' \
            .config || true

          echo
          echo "========================================"
          echo "MT7915"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_kmod-mt76-connac=|^CONFIG_PACKAGE_kmod-mt76-core=|^CONFIG_PACKAGE_kmod-mt7915-firmware=|^CONFIG_PACKAGE_kmod-mt7915e=|^CONFIG_PACKAGE_wpad-openssl=' \
            .config || true

          echo
          echo "========================================"
          echo "INITRAMFS"
          echo "========================================"

          grep -E \
            '^CONFIG_TARGET_INITRAMFS_' \
            .config || true

          echo
          echo "DTS CHECK"

          test -f target/linux/ramips/dts/mt7621_qihoo_360t6m.dts

          echo "DTS OK."

      # =========================================================
      # 8. Build firmware
      # =========================================================
      - name: Build Firmware
        run: |
          set -e

          echo
          echo "========================================"
          echo "FULL BUILD"
          echo "========================================"

          make -j$(nproc) V=s

      # =========================================================
      # 9. Build kernel target
      # =========================================================
      - name: Build Kernel Targets
        run: |
          set -e

          echo
          echo "========================================"
          echo "KERNEL TARGETS"
          echo "========================================"

          make target/linux/compile -j$(nproc) V=s

      # =========================================================
      # 10. Search for kernel files
      # =========================================================
      - name: Find Kernel Files
        run: |
          echo
          echo "========================================"
          echo "KERNEL FILES"
          echo "========================================"

          echo
          echo "--- build_dir kernel files ---"

          find build_dir \
            -type f \
            \( \
              -name 'vmlinux' \
              -o -name 'vmlinux.bin' \
              -o -name 'vmlinux.bin.gz' \
              -o -name 'vmlinux.bin.lzma' \
              -o -name 'vmlinux.bin.lz4' \
              -o -name 'vmlinux.bin.xz' \
              -o -name '*initramfs*' \
              -o -name '*kernel*.bin' \
            \) \
            -print 2>/dev/null || true

          echo
          echo "--- bin target files ---"

          find bin/targets/ramips/mt7621 \
            -type f \
            -print \
            2>/dev/null || true

      # =========================================================
      # 11. Prepare kernel artifact directory
      # =========================================================
      - name: Prepare Kernel Artifact
        run: |
          set -e

          mkdir -p kernel-artifact

          echo
          echo "========================================"
          echo "COLLECT KERNEL"
          echo "========================================"

          # Copy all firmware images
          find bin/targets/ramips/mt7621 \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.ubi' \
              -o -name '*.itb' \
              -o -name '*.img' \
            \) \
            -exec cp -v {} kernel-artifact/ \; \
            2>/dev/null || true

          # Copy vmlinux / kernel images from build tree
          find build_dir \
            -type f \
            \( \
              -name 'vmlinux' \
              -o -name 'vmlinux.bin' \
              -o -name 'vmlinux.bin.gz' \
              -o -name 'vmlinux.bin.lzma' \
              -o -name 'vmlinux.bin.lz4' \
              -o -name 'vmlinux.bin.xz' \
              -o -name '*initramfs*' \
            \) \
            -exec cp -v {} kernel-artifact/ \; \
            2>/dev/null || true

          # Copy checksums
          if [ -f bin/targets/ramips/mt7621/sha256sums ]; then
            cp \
              bin/targets/ramips/mt7621/sha256sums \
              kernel-artifact/
          fi

          echo
          echo "========================================"
          echo "FINAL ARTIFACT"
          echo "========================================"

          find kernel-artifact \
            -type f \
            -exec ls -lh {} \;

          echo
          echo "========================================"
          echo "SHA256"
          echo "========================================"

          cd kernel-artifact

          for f in *; do
            if [ -f "$f" ]; then
              sha256sum "$f"
            fi
          done

      # =========================================================
      # 12. Upload firmware + kernel
      # =========================================================
      - name: Upload Firmware and Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-23.05.0-360T6M-Firmware-Kernel
          path: kernel-artifact/*
          if-no-files-found: error

      # =========================================================
      # 13. Upload complete build information
      # =========================================================
      - name: Upload Build Information
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-23.05.0-360T6M-Build-Info
          path: |
            .config
            target/linux/ramips/dts/mt7621_qihoo_360t6m.dts
          if-no-files-found: error
