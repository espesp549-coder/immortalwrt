name: Build ImmortalWrt for Qihoo 360T6M

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  TZ: Asia/Baghdad

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install build-essential clang flex bison gstreamer1.0-plugins-base gstreamer1.0-tools libffi-dev libgdk-pixbuf2.0-dev libglib2.0-dev libgmp-dev libltdl-dev libncurses-dev libncurses5-dev libpcap-dev libpcre3-dev libssl-dev libxml2-dev openssl python3-dev python3-setuptools rsync subversion swig time xsltproc zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone ImmortalWrt Source
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      working-directory: /workdir/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Auto Patch PCIe DTS Node
      working-directory: /workdir/openwrt
      run: |
        echo "Searching and patching 360T6M DTS files..."
        find target/linux/ramips/ -type f \( -name "*360t6m*.dts" -o -name "*360*.dts" \) | while read -r dts_file; do
          if grep -q "pcie@1e140000" "$dts_file"; then
            sed -i '/pcie@1e140000 {/a \                resets = <0x05 0x18 0x05 0x19 0x05 0x1a>;\n                reset-names = "pcie0\\0pcie1\\0pcie2";' "$dts_file"
            echo "Successfully patched: $dts_file"
          fi
        done

    - name: Verify DTS Patching (Safety Check)
      working-directory: /workdir/openwrt
      run: |
        echo "Verifying if PCIe resets exist in DTS..."
        DTS_FILE=$(find target/linux/ramips/ -type f \( -name "*360t6m*.dts" -o -name "*360*.dts" \) | head -n 1)
        if grep -q 'reset-names = "pcie0' "$DTS_FILE"; then
          echo "=========================================="
          echo "SUCCESS: PCIe Resets correctly injected!"
          echo "=========================================="
        else
          echo "=========================================="
          echo "ERROR: Patch failed! Stopping build early."
          echo "=========================================="
          exit 1
        fi

    - name: Generate Config for 360T6M
      working-directory: /workdir/openwrt
      run: |
        echo "CONFIG_TARGET_ramips=y" > .config
        echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
        echo "CONFIG_TARGET_ramips_mt7621_DEVICE_360_360t6m=y" >> .config
        echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> .config
        echo "CONFIG_PACKAGE_kmod-mt76-core=y" >> .config
        make defconfig

    - name: Download Packages
      working-directory: /workdir/openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: /workdir/openwrt
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_360T6M_Fixed
        path: /workdir/openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin
        
