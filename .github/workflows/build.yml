name: Build ImmortalWrt 23.05.0 for 360T6M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ImmortalWrt 23.05.0
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-23.05
          fetch-depth: 1

      - name: Setup Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Initialization Environment
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libelf-dev \
            swig \
            ccache \
            cmake \
            zstd

      - name: Verify ImmortalWrt Source
        run: |
          echo "===== SOURCE ====="
          git remote -v
          git log -1 --oneline
          echo

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify 360T6M DTS
        run: |
          DTS="target/linux/ramips/dts/mt7621_qihoo_360t6m.dts"

          echo "===== CHECK DTS ====="

          if [ ! -f "$DTS" ]; then
            echo "ERROR: DTS not found:"
            echo "$DTS"
            exit 1
          fi

          echo "DTS FOUND:"
          ls -lh "$DTS"

          echo
          echo "===== DTS DEVICE ====="
          grep -n -E '360|T6M|compatible|model' "$DTS" | head -50 || true

          echo
          echo "===== PCIe ====="
          grep -n -A80 -B10 'pcie@1e140000' "$DTS" || true

      - name: Load 360T6M Configuration
        run: |
          cat << 'EOF' > .config

          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y
          CONFIG_LEGACY_IMAGE_FORMAT=y

          # UBI / UBIFS
          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y

          # TPROXY / TUN
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y

          # Wi-Fi
          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_wpad-openssl=y

          # LuCI / SSH
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_dropbear=y

          EOF

          make defconfig

      - name: Verify Final Configuration
        run: |
          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_' .config | grep -E 'ramips|mt7621|360_t6m' || true

          echo
          echo "===== MT7915 ====="
          grep '^CONFIG_PACKAGE_.*mt7915' .config || true

          echo
          echo "===== MT76 ====="
          grep '^CONFIG_PACKAGE_.*mt76' .config || true

          echo
          echo "===== TPROXY / TUN ====="
          grep '^CONFIG_PACKAGE_kmod-nft-tproxy' .config || true
          grep '^CONFIG_PACKAGE_kmod-tun' .config || true

      - name: Download Sources
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        run: |
          make -j$(nproc) V=s

      - name: List Firmware
        if: success()
        run: |
          echo "===== FIRMWARE ====="
          find bin/targets/ramips/mt7621/ \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' | sort

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-23.05.0-360T6M-${{ github.run_number }}
          path: |
            bin/targets/ramips/mt7621/*
