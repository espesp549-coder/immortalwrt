name: Build ImmortalWrt for Qihoo 360T6M

on:
  workflow_dispatch:

env:
  TZ: Asia/Baghdad

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install build-essential clang flex bison gstreamer1.0-plugins-base gstreamer1.0-tools libffi-dev libgdk-pixbuf2.0-dev libglib2.0-dev libgmp-dev libltdl-dev libncurses-dev libncurses5-dev libpcap-dev libpcre3-dev libssl-dev libxml2-dev openssl python3-dev python3-setuptools rsync subversion swig time xsltproc zlib1g-dev
        sudo timedatectl set-timezone "$TZ"

    - name: Update & Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure Build
      run: |
        if [ -f config.seed ]; then
          cp config.seed .config
        elif [ -f "config seed" ]; then
          cp "config seed" .config
        fi
        make defconfig

    - name: Set Custom IP via UCI Defaults
      run: |
        mkdir -p files/etc/uci-defaults
        cat << 'EOF' > files/etc/uci-defaults/99-custom-ip
        #!/bin/sh
        uci set network.lan.ipaddr='192.168.1.1'
        uci set network.lan.netmask='255.255.255.0'
        uci commit network
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-custom-ip

    - name: Verify Network & DHCP Config Before Build
      run: |
        echo ">>> التحقق من إعدادات الشبكة وتوزيع الآيبيات قبل البناء..."
        
        # 1. التأكد من وجود سكريبت الـ UCI لتثبيت الآيبي 192.168.1.1
        if [ ! -f files/etc/uci-defaults/99-custom-ip ]; then
          echo "❌ خطأ: سكريبت إعدادات الآيبي غير موجود!" && exit 1
        fi
        
        # 2. التأكد من تفعيل خادم الـ DHCP (dnsmasq) لتوزيع الآيبيات
        if ! grep -q "CONFIG_PACKAGE_dnsmasq=y\|CONFIG_PACKAGE_dnsmasq-full=y" .config; then
          echo "⚠️ خادم الـ DHCP غير مفعل في .config، جاري تفعيله إجبارياً..."
          echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
          make defconfig
        fi
        
        # 3. التأكد من وجود ملف الـ DTS الخاص بـ 360T6M
        if [ ! -f target/linux/ramips/dts/t6m.dts ]; then
          echo "❌ خطأ: ملف t6m.dts غير موجود في المسار المطلوب!" && exit 1
        fi
        
        echo "✅ تم فحص جميع إعدادات الـ LAN والـ DHCP بنجاح، جاهز للبناء."

    - name: Download Packages
      run: |
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_360T6M_Uncompressed
        path: |
          bin/targets/ramips/mt7621/*.bin
          bin/targets/ramips/mt7621/manifest
          
