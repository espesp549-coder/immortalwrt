name: Build ImmortalWrt for Qihoo 360T6M

on:
  workflow_dispatch:

env:
  TZ: Asia/Baghdad

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install build-essential ccache clang flex bison gstreamer1.0-plugins-base gstreamer1.0-tools libffi-dev libgdk-pixbuf2.0-dev libglib2.0-dev libgmp-dev libltdl-dev libncurses-dev libncurses5-dev libpcap-dev libpcre3-dev libssl-dev libxml2-dev openssl python3-dev python3-setuptools rsync subversion swig time xsltproc zlib1g-dev
        sudo timedatectl set-timezone "$TZ"

    - name: Cache OpenWrt DL Directory
      uses: actions/cache@v4
      with:
        path: dl
        key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-

    - name: Cache Ccache Data
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-

    - name: Update & Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Patch Exact DTS and 02_network
      run: |
        python3 -c '
        dts_content = """/dts-v1/;

        #include "mt7621.dtsi"

        #include <dt-bindings/gpio/gpio.h>
        #include <dt-bindings/input/input.h>

        / {
        	compatible = "qihoo,360t6m", "360,360t6m", "360,t6m", "mediatek,mt7621-soc";
        	model = "Qihoo 360T6M";

        	aliases {
        		led-boot = &led_system;
        		led-failsafe = &led_system;
        		led-running = &led_system;
        		led-upgrade = &led_system;
        	};

        	chosen {
        		bootargs = "console=ttyS0,115200";
        	};

        	leds {
        		compatible = "gpio-leds";

        		power {
        			label = "red:power";
        			gpios = <&gpio 13 GPIO_ACTIVE_LOW>;
        		};

        		led_system: system {
        			label = "green:system";
        			gpios = <&gpio 15 GPIO_ACTIVE_HIGH>;
        		};
        	};

        	keys {
        		compatible = "gpio-keys";

        		reset {
        			label = "reset";
        			gpios = <&gpio 7 GPIO_ACTIVE_LOW>;
        			linux,code = <KEY_RESTART>;
        		};

        		wps {
        			label = "wps";
        			gpios = <&gpio 6 GPIO_ACTIVE_LOW>;
        			linux,code = <KEY_WPS_BUTTON>;
        		};
        	};
        };

        &nand {
        	status = "okay";

        	partitions {
        		compatible = "fixed-partitions";
        		#address-cells = <1>;
        		#size-cells = <1>;

        		partition@0 {
        			label = "Bootloader";
        			reg = <0x000000 0x080000>;
        			read-only;
        		};

        		partition@80000 {
        			label = "Nvram";
        			reg = <0x080000 0x040000>;
        			read-only;
        		};

        		partition@c0000 {
        			label = "Bdata";
        			reg = <0x0c0000 0x040000>;
        			read-only;
        		};

        		factory: partition@100000 {
        			label = "Factory";
        			reg = <0x100000 0x080000>;
        			read-only;

        			nvmem-layout {
        				compatible = "fixed-layout";
        				#address-cells = <1>;
        				#size-cells = <1>;

        				macaddr_factory_e000: macaddr@e000 {
        					reg = <0xe000 0x6>;
        				};

        				macaddr_factory_e006: macaddr@e006 {
        					reg = <0xe006 0x6>;
        				};
        			};
        		};

        		partition@180000 {
        			label = "crash";
        			reg = <0x180000 0x040000>;
        			read-only;
        		};

        		partition@1c0000 {
        			label = "crash_log";
        			reg = <0x1c0000 0x040000>;
        			read-only;
        		};

        		partition@200000 {
        			label = "kernel";
        			reg = <0x200000 0x400000>;
        		};

        		partition@600000 {
        			label = "ubi";
        			reg = <0x600000 0x7980000>;
        		};
        	};
        };

        &eth {
        	status = "okay";

        	gmac0: mac@0 {
        		compatible = "mediatek,eth-mac";
        		reg = <0>;
        		phy-mode = "rgmii";
        		nvmem-cells = <&macaddr_factory_e000>;
        		nvmem-cell-names = "mac-address";

        		fixed-link {
        			speed = <1000>;
        			full-duplex;
        		};
        	};
        };

        &switch0 {
        	ports {
        		port@0 {
        			status = "okay";
        			label = "lan3";
        		};

        		port@1 {
        			status = "okay";
        			label = "lan2";
        		};

        		port@2 {
        			status = "okay";
        			label = "lan1";
        		};

        		port@3 {
        			status = "okay";
        			label = "wan";
        			nvmem-cells = <&macaddr_factory_e006>;
        			nvmem-cell-names = "mac-address";
        		};

        		port@6 {
        			status = "okay";
        			ethernet = <&gmac0>;
        			phy-mode = "rgmii";

        			fixed-link {
        				speed = <1000>;
        				full-duplex;
        			};
        		};
        	};
        };
        """
        with open("target/linux/ramips/dts/mt7621_qihoo_360t6m.dts", "w") as f:
            f.write(dts_content)
        '
        echo '' >> target/linux/ramips/mt7621/base-files/etc/board.d/02_network
        echo 'case "$board" in' >> target/linux/ramips/mt7621/base-files/etc/board.d/02_network
        echo 'qihoo,360t6m|360,360t6m|360,t6m|360t6m)' >> target/linux/ramips/mt7621/base-files/etc/board.d/02_network
        echo '	ucidef_set_interfaces_lan_wan "lan1 lan2 lan3" "wan"' >> target/linux/ramips/mt7621/base-files/etc/board.d/02_network
        echo '	;;' >> target/linux/ramips/mt7621/base-files/etc/board.d/02_network
        echo 'esac' >> target/linux/ramips/mt7621/base-files/etc/board.d/02_network

    - name: Configure Build
      run: |
        if [ -f config.seed ]; then
          cp config.seed .config
        elif [ -f "config seed" ]; then
          cp "config seed" .config
        fi
        echo "CONFIG_CCACHE=y" >> .config
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        make defconfig

    - name: Set Custom IP via UCI Defaults
      run: |
        mkdir -p files/etc/uci-defaults
        echo '#!/bin/sh' > files/etc/uci-defaults/99-custom-ip
        echo "uci set network.lan.ipaddr='192.168.1.1'" >> files/etc/uci-defaults/99-custom-ip
        echo "uci set network.lan.netmask='255.255.255.0'" >> files/etc/uci-defaults/99-custom-ip
        echo "uci commit network" >> files/etc/uci-defaults/99-custom-ip
        echo "exit 0" >> files/etc/uci-defaults/99-custom-ip
        chmod +x files/etc/uci-defaults/99-custom-ip

    - name: Download Packages
      run: |
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_360T6M_Fixed
        path: |
          bin/targets/ramips/mt7621/*.bin
          bin/targets/ramips/mt7621/manifest
          
