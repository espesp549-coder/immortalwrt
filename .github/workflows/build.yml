name: Build OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Branch
        run: |
          git branch --show-current
          git log -1 --oneline

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc zlib1g-dev ecj fastjar java-common libelf-dev libfuse-dev libsnmp-dev python3-setuptools rsync subversion swig unzip zstd file wget

      - name: Download packages & Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject uImage Device Definition
        run: |
          sed -i '/define Device\/360_t6m/,/endef/d' target/linux/ramips/image/mt7621.mk
          sed -i '/TARGET_DEVICES += 360_t6m/d' target/linux/ramips/image/mt7621.mk

          cat << 'EOF' >> target/linux/ramips/image/mt7621.mk

          define Device/360_t6m
            $(Device/nand)
            DEVICE_VENDOR := 360
            DEVICE_MODEL := T6M
            DEVICE_DTS := mt7621_qihoo_360t6m
            SOC := mt7621
            KERNEL_SIZE := 4096k
            IMAGE_SIZE := 124416k
            BLOCKSIZE := 128k
            PAGESIZE := 2048
            KERNEL_LOADADDR := 0x80001000
            KERNEL := kernel-bin | append-dtb | lzma | uImage lzma
            DEVICE_PACKAGES := kmod-mt76-connac kmod-mt76-core kmod-mt7915-firmware kmod-mt7915e kmod-tun kmod-nft-tproxy wpad-openssl luci luci-ssl dropbear
            IMAGES += factory.bin
            IMAGE/factory.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          endef
          TARGET_DEVICES += 360_t6m
          EOF

      - name: Inject Master Network Configuration
        run: |
          mkdir -p files/etc/config
          cat << 'EOF' > files/etc/config/network
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config globals 'globals'
              option ula_prefix 'fd00::/64'

          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth0'
              list ports 'eth1'
              list ports 'lan1'
              list ports 'lan2'
              list ports 'lan3'
              list ports 'wan'

          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '192.168.1.1'
              option netmask '255.255.255.0'
          EOF

      - name: Load Custom Config
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y
          CONFIG_LEGACY_IMAGE_FORMAT=y

          # UBI/UBIFS support
          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y

          # tproxy/tun
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y

          # Wi-Fi
          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_wpad-openssl=y

          # Essential Tools
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_dropbear=y
          EOF

          make defconfig

      - name: Verify Device Definition & uImage
        run: |
          grep -n "360_t6m" target/linux/ramips/image/mt7621.mk || exit 1
          grep -n "uImage lzma" target/linux/ramips/image/mt7621.mk || exit 1
          test -f target/linux/ramips/dts/mt7621_qihoo_360t6m.dts || exit 1

      - name: Download package sources
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware-${{ github.run_number }}
          path: |
            bin/targets/ramips/mt7621/*360*
            
