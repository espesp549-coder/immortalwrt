name: Build OpenWrt

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v23.05.0

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Source
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt

      - name: Inject Device Definition
        run: |
          cd openwrt
          echo '' >> target/linux/ramips/image/mt7621.mk
          echo 'define Device/qihoo_360t6m' >> target/linux/ramips/image/mt7621.mk
          echo '  $(Device/nand)' >> target/linux/ramips/image/mt7621.mk
          echo '  DEVICE_VENDOR := 360' >> target/linux/ramips/image/mt7621.mk
          echo '  DEVICE_MODEL := 360T6M' >> target/linux/ramips/image/mt7621.mk
          echo '  DEVICE_DTS := mt7621_qihoo_360t6m' >> target/linux/ramips/image/mt7621.mk
          echo '  DEVICE_DTS_DIR := ../dts' >> target/linux/ramips/image/mt7621.mk
          echo '  SOC := mt7621' >> target/linux/ramips/image/mt7621.mk
          echo '  KERNEL_SIZE := 4096k' >> target/linux/ramips/image/mt7621.mk
          echo '  IMAGE_SIZE := 124416k' >> target/linux/ramips/image/mt7621.mk
          echo '  UBINIZE_OPTS := -E 5' >> target/linux/ramips/image/mt7621.mk
          echo '  BLOCKSIZE := 128k' >> target/linux/ramips/image/mt7621.mk
          echo '  PAGESIZE := 2048' >> target/linux/ramips/image/mt7621.mk
          echo '  KERNEL_LOADADDR := 0x80000000' >> target/linux/ramips/image/mt7621.mk
          echo '  KERNEL := kernel-bin | relocate-kernel $(loadaddr-y) | lzma | fit lzma $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb' >> target/linux/ramips/image/mt7621.mk
          echo '  DEVICE_PACKAGES := kmod-mt76-connac kmod-mt76-core kmod-mt7915-firmware kmod-mt7915e kmod-tun kmod-nft-tproxy wpad-openssl luci luci-ssl dropbear' >> target/linux/ramips/image/mt7621.mk
          echo '  IMAGES += factory.bin' >> target/linux/ramips/image/mt7621.mk
          echo '  IMAGE/factory.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size' >> target/linux/ramips/image/mt7621.mk
          echo '  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata' >> target/linux/ramips/image/mt7621.mk
          echo 'endef' >> target/linux/ramips/image/mt7621.mk
          echo 'TARGET_DEVICES += qihoo_360t6m' >> target/linux/ramips/image/mt7621.mk
          
          if [ -f "../mt7621_qihoo_360t6m.dts" ]; then
            cp ../mt7621_qihoo_360t6m.dts target/linux/ramips/dts/
          fi

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc zlib1g-dev ecj fastjar java-common libelf-dev libfuse-dev libsnmp-dev python3-setuptools rsync subversion swig unzip zstd file wget

      - name: Download packages & Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Config
        run: |
          cd openwrt
          [ -e ../config.seed ] && cp ../config.seed .config
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_qihoo_360t6m=y" >> .config
          make defconfig

      - name: Verify Device Definition
        run: |
          cd openwrt
          echo "=== Checking Makefile device definition ==="
          grep -n "qihoo_360t6m" target/linux/ramips/image/mt7621.mk || (echo "ERROR: Device not found in mt7621.mk" && exit 1)
          
          echo "=== Verify KERNEL uses FIT + LZMA Compression ==="
          grep "fit lzma" target/linux/ramips/image/mt7621.mk && echo "OK: FIT LZMA confirmed" || (echo "ERROR: FIT LZMA not set!" && exit 1)
          echo "=== All checks passed ==="

      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware-${{ github.run_number }}
          path: |
            openwrt/bin/targets/ramips/mt7621/*factory.bin
            openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin
            
