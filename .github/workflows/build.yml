name: Build ImmortalWrt 23.05.0 - 360T6M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. Checkout YOUR repository / 23.05.0 branch
      # =========================================================
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 23.05.0
          fetch-depth: 1

      # =========================================================
      # 2. Install build dependencies
      # =========================================================
      - name: Install Build Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time

      # =========================================================
      # 3. Check repository and DTS
      # =========================================================
      - name: Check Source and DTS
        run: |
          set -e

          echo "========================================"
          echo "SOURCE INFORMATION"
          echo "========================================"

          git branch --show-current
          git rev-parse HEAD
          git remote -v

          echo
          echo "========================================"
          echo "CHECK 360T6M DTS"
          echo "========================================"

          DTS="target/linux/ramips/dts/mt7621_qihoo_360t6m.dts"

          if [ ! -f "$DTS" ]; then
            echo
            echo "ERROR: DTS NOT FOUND:"
            echo "$DTS"
            echo
            echo "Available 360 / Qihoo DTS files:"
            find target/linux/ramips/dts \
              -type f \
              \( -iname '*360*' -o -iname '*qihoo*' \) \
              -print || true
            exit 1
          fi

          echo "DTS FOUND:"
          ls -lh "$DTS"

          echo
          echo "========================================"
          echo "DEVICE INFORMATION"
          echo "========================================"

          grep -n -E \
            'compatible|model|360|T6M' \
            "$DTS" || true

          echo
          echo "========================================"
          echo "PCIe DTS"
          echo "========================================"

          grep -n -A80 -B10 \
            'pcie@1e140000' \
            "$DTS" || true

      # =========================================================
      # 4. Update feeds
      # =========================================================
      - name: Update Feeds
        run: |
          set -e

          ./scripts/feeds update -a

      # =========================================================
      # 5. Install only required feeds
      # =========================================================
      - name: Install Required Feeds
        run: |
          set -e

          ./scripts/feeds install -a

      # =========================================================
      # 6. Create configuration
      # =========================================================
      - name: Configure 360T6M
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y

          CONFIG_LEGACY_IMAGE_FORMAT=y

          # UBI / UBIFS
          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y

          # TPROXY / TUN
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y

          # MediaTek WiFi
          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_wpad-openssl=y

          # Basic
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_dropbear=y
          EOF

          echo
          echo "========================================"
          echo "RUNNING DEFCONFIG"
          echo "========================================"

          make defconfig

      # =========================================================
      # 7. Verify final configuration
      # =========================================================
      - name: Verify Configuration
        run: |
          set -e

          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep -E \
            '^CONFIG_TARGET_|^CONFIG_TARGET_PROFILE=' \
            .config || true

          echo
          echo "========================================"
          echo "REQUESTED PACKAGES"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(kmod-nft-tproxy|kmod-tun|iptables-nft|kmod-mt76-connac|kmod-mt76-core|kmod-mt7915-firmware|kmod-mt7915e|wpad-openssl|luci|luci-ssl|dropbear)=' \
            .config || true

          echo
          echo "========================================"
          echo "NETFILTER"
          echo "========================================"

          grep -E \
            'CONFIG_NETFILTER_XT_TARGET_TPROXY=|CONFIG_NETFILTER_XT_MATCH_SOCKET=|CONFIG_NF_CONNTRACK_MARK=' \
            .config || true

          echo
          echo "========================================"
          echo "DTS STILL PRESENT"
          echo "========================================"

          test -f target/linux/ramips/dts/mt7621_qihoo_360t6m.dts

          echo "OK: DTS exists."

      # =========================================================
      # 8. Build firmware
      # =========================================================
      - name: Build Firmware
        run: |
          set -e

          echo "========================================"
          echo "BUILD START"
          echo "========================================"

          make -j$(nproc) V=s

      # =========================================================
      # 9. Show generated firmware
      # =========================================================
      - name: List Firmware
        run: |
          echo "========================================"
          echo "GENERATED FIRMWARE"
          echo "========================================"

          find bin/targets/ramips/mt7621 \
            -type f \
            \( \
              -name '*.bin' \
              -o -name '*.ubi' \
              -o -name '*.itb' \
              -o -name '*.img' \
            \) \
            -print \
            -exec ls -lh {} \;

      # =========================================================
      # 10. Upload firmware
      # =========================================================
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-23.05.0-360T6M
          path: |
            bin/targets/ramips/mt7621/*.bin
            bin/targets/ramips/mt7621/*.ubi
            bin/targets/ramips/mt7621/*.itb
            bin/targets/ramips/mt7621/*.img
            bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: error
