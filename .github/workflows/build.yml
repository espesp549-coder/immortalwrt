name: Build ImmortalWrt 23.05.0 for 360T6M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ImmortalWrt 23.05.0
        uses: actions/checkout@v4
        with:
          ref: openwrt-23.05
          fetch-depth: 1

      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libelf-dev \
            libfuse-dev \
            libsnmp-dev \
            swig \
            ccache \
            cmake \
            zstd

      - name: Verify Source
        run: |
          echo "===== SOURCE ====="
          git branch --show-current
          git log -1 --oneline
          echo

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install Custom 360T6M DTS
        run: |
          DTS_FILE="target/linux/ramips/dts/mt7621_qihoo_360t6m.dts"

          echo "===== DTS ====="

          if [ ! -f "$DTS_FILE" ]; then
            echo "ERROR: DTS file not found:"
            echo "$DTS_FILE"
            exit 1
          fi

          echo "Using:"
          echo "$DTS_FILE"

          ls -lh "$DTS_FILE"

          echo
          echo "===== PCIe NODE ====="
          grep -n -A80 -B10 'pcie@1e140000' "$DTS_FILE" || true

      - name: Verify 360T6M Device
        run: |
          echo "===== CHECKING DEVICE ====="

          grep -R "360_t6m" -n \
            target/linux/ramips/image \
            target/linux/ramips/image/mt7621.mk \
            2>/dev/null || true

          echo
          echo "===== DTS REFERENCES ====="

          grep -R "mt7621_qihoo_360t6m" -n \
            target/linux/ramips \
            2>/dev/null || true

      - name: Load Build Configuration
        run: |
          cat << 'EOF' > .config

          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y
          CONFIG_LEGACY_IMAGE_FORMAT=y

          # UBI/UBIFS support
          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y

          # TProxy / TUN
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y

          # Wi-Fi
          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_wpad-openssl=y

          # LuCI / SSH
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_dropbear=y

          EOF

          make defconfig

      - name: Verify Final Configuration
        run: |
          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_' .config | grep -E 'ramips|mt7621|360_t6m' || true

          echo
          echo "===== WIFI ====="
          grep '^CONFIG_PACKAGE_.*mt76\|^CONFIG_PACKAGE_.*mt7915\|^CONFIG_PACKAGE_wpad' .config || true

          echo
          echo "===== TPROXY / TUN ====="
          grep '^CONFIG_PACKAGE_kmod-nft-tproxy\|^CONFIG_PACKAGE_kmod-tun\|^CONFIG_PACKAGE_iptables-nft' .config || true

      - name: Download Package Sources
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        run: |
          make -j$(nproc) V=s

      - name: List Firmware
        if: success()
        run: |
          echo "===== FIRMWARE ====="
          find bin/targets/ramips/mt7621/ \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' | sort

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-23.05.0-360T6M-${{ github.run_number }}
          path: |
            bin/targets/ramips/mt7621/*
