name: Build ImmortalWrt for 360T6M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            xsltproc \
            zlib1g-dev \
            ecj \
            fastjar \
            java-common \
            libelf-dev \
            libfuse-dev \
            libsnmp-dev \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            unzip \
            zstd \
            file \
            wget

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject 360T6M Device
        run: |
          sed -i '/define Device\/360_t6m/,/endef/d' target/linux/ramips/image/mt7621.mk
          sed -i '/TARGET_DEVICES += 360_t6m/d' target/linux/ramips/image/mt7621.mk

          cat << 'EOF' >> target/linux/ramips/image/mt7621.mk

          define Device/360_t6m
            $(Device/nand)
            DEVICE_VENDOR := 360
            DEVICE_MODEL := T6M
            DEVICE_DTS := mt7621_qihoo_360t6m
            SOC := mt7621
            KERNEL_SIZE := 4096k
            IMAGE_SIZE := 124416k
            BLOCKSIZE := 128k
            PAGESIZE := 2048
            KERNEL_LOADADDR := 0x80001000
            KERNEL := kernel-bin | append-dtb | lzma | uImage lzma
            DEVICE_PACKAGES := \
              kmod-mt76-connac \
              kmod-mt76-core \
              kmod-mt7915-firmware \
              kmod-mt7915e \
              kmod-tun \
              kmod-nft-tproxy \
              wpad-openssl \
              luci \
              luci-ssl \
              dropbear
            IMAGES += factory.bin
            IMAGE/factory.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          endef

          TARGET_DEVICES += 360_t6m
          EOF

      - name: Patch 360T6M DTS
        run: |
          python3 - << 'PY'
          from pathlib import Path

          p = Path("target/linux/ramips/dts/mt7621_qihoo_360t6m.dts")
          s = p.read_text()

          patch = r'''

          /* 360 T6M PCIe reset fix */
          &{/pcie@1e140000} {
              status = "okay";

              /delete-property/ reset-gpios;

              resets = <&rstctrl 28>,
                       <&rstctrl 29>,
                       <&rstctrl 30>;

              reset-names = "pcie0",
                            "pcie1",
                            "pcie2";
          };
          '''

          if "360 T6M PCIe reset fix" not in s:
              s += patch

          p.write_text(s)
          PY

      - name: Patch Kernel Reset Configuration
        run: |
          for cfg in target/linux/ramips/mt7621/config-*; do
            [ -f "$cfg" ] || continue

            grep -qxF 'CONFIG_RESET_CONTROLLER=y' "$cfg" || \
              echo 'CONFIG_RESET_CONTROLLER=y' >> "$cfg"

            grep -qxF 'CONFIG_RESET_MT7621=y' "$cfg" || \
              echo 'CONFIG_RESET_MT7621=y' >> "$cfg"

            grep -qxF 'CONFIG_MFD_SYSCON=y' "$cfg" || \
              echo 'CONFIG_MFD_SYSCON=y' >> "$cfg"
          done

      - name: Configure Network
        run: |
          mkdir -p files/etc/config

          cat << 'EOF' > files/etc/config/network
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config globals 'globals'
              option ula_prefix 'fd00::/64'

          config interface 'lan'
              option device 'eth0'
              option proto 'static'
              option ipaddr '192.168.1.1'
              option netmask '255.255.255.0'
          EOF

      - name: Load Custom Config
        run: |
          cat << 'EOF' > .config

          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y

          CONFIG_LEGACY_IMAGE_FORMAT=y

          CONFIG_RESET_CONTROLLER=y
          CONFIG_RESET_MT7621=y
          CONFIG_MFD_SYSCON=y

          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y

          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y

          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_wpad-openssl=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_dropbear=y

          EOF

          make defconfig

      - name: Verify DTS
        run: |
          grep -n -A15 -B5 "360 T6M PCIe reset fix" \
            target/linux/ramips/dts/mt7621_qihoo_360t6m.dts

      - name: Download Package Sources
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M-Fixed-${{ github.run_number }}
          path: |
            bin/targets/ramips/mt7621/*360*
            bin/targets/ramips/mt7621/sha256sums
