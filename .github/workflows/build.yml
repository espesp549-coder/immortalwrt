name: Build ImmortalWrt - 360 T6M

on:
  workflow_dispatch:
  push:
    paths:
      - 'files/**'
      - '.github/workflows/build.yml'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  REPO_TAG: v23.05.0
  TARGET: ramips
  SUBTARGET: mt7621
  DEVICE_PKG: 360_t6m
  DTS_FILE: mt7621_qihoo_360t6m.dts
  MK_SNIPPET: 360_t6m.mk

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout customization repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 aria2 asciidoc autoconf automake \
            autopoint binutils bison build-essential bzip2 ccache cmake \
            cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libncursesw5-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip \
            p7zip-full patch pkgconf python2.7-dev python3-dev python3-pip \
            libpython3-dev qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            zstd

      - name: Clone ImmortalWrt source (${{ env.REPO_TAG }})
        run: |
          git clone --branch $REPO_BRANCH --single-branch --depth 1 $REPO_URL openwrt
          cd openwrt
          git fetch --depth 1 origin tag $REPO_TAG
          git checkout $REPO_TAG

      - name: Cache toolchain build directories
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ env.REPO_TAG }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('openwrt/include/kernel-*.mk', 'openwrt/toolchain/**') }}
          restore-keys: |
            toolchain-${{ env.REPO_TAG }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-

      - name: Cache downloaded package sources
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.REPO_TAG }}-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            dl-${{ env.REPO_TAG }}-

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject custom DTS
        run: |
          cp files/$DTS_FILE openwrt/target/linux/ramips/dts/
          echo "DTS copied:"
          ls -la openwrt/target/linux/ramips/dts/$DTS_FILE

      - name: Inject switch port mapping (02_network)
        run: |
          python3 - << 'EOF'
          import re, sys

          path = "openwrt/target/linux/ramips/mt7621/base-files/etc/board.d/02_network"
          with open(path) as f:
              content = f.read()

          if "360,360t6m" in content:
              print("Entry already present — skipping.")
              sys.exit(0)

          m = re.search(r'(ramips_setup_interfaces\(\)\s*\{.*?case\s+"?\$board"?\s+in\n)', content, re.S)
          if not m:
              sys.exit("ERROR: could not find case anchor in 02_network — check file manually.")

          block = (
              '\t360,360t6m)\n'
              '\t\tucidef_add_switch "switch0" \\\n'
              '\t\t\t"0:lan:3" "1:lan:2" "2:lan:1" "3:wan" "6@eth0"\n'
              '\t\t;;\n'
          )
          new_content = content[:m.end()] + block + content[m.end():]
          with open(path, "w") as f:
              f.write(new_content)
          print("Inserted 360,360t6m switch mapping into 02_network.")
          EOF

      - name: Inject device definition into mt7621.mk
        run: |
          cd openwrt
          MK=target/linux/ramips/image/mt7621.mk
          if grep -q "Device/${DEVICE_PKG}" "$MK"; then
            echo "Device/${DEVICE_PKG} already defined in $MK — skipping append."
          else
            echo "" >> "$MK"
            cat ../files/$MK_SNIPPET >> "$MK"
            echo "Appended device block to $MK"
          fi

      - name: Generate .config
        run: |
          cd openwrt
          cat > .config << EOF
          CONFIG_TARGET_${TARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${DEVICE_PKG}=y
          EOF
          make defconfig

      - name: Show resolved config (sanity check)
        run: |
          cd openwrt
          grep DEVICE_360 .config || echo "WARNING: device profile not enabled — check names above"

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Show build output
        run: |
          find openwrt/bin/targets/$TARGET/$SUBTARGET -type f

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-360-t6m-${{ github.run_number }}
          path: openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*
          if-no-files-found: error
