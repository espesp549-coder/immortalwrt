name: Build OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc zlib1g-dev ecj fastjar java-common libelf-dev libfuse-dev libsnmp-dev python3-setuptools rsync subversion swig unzip zstd file wget

      - name: Download packages & Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Config
        run: |
          [ -e config.seed ] && cp config.seed .config
          make defconfig

      - name: Verify Device Definition
        run: |
          echo "=== Checking Makefile device definition ==="
          grep -n "qihoo_360t6m" target/linux/ramips/image/mt7621.mk || (echo "ERROR: Device not found in mt7621.mk" && exit 1)
          echo "=== Checking DTS file exists ==="
          ls -la target/linux/ramips/dts/mt7621_qihoo_360t6m.dts || (echo "ERROR: DTS file not found" && exit 1)
          echo "=== Checking .config has device enabled ==="
          grep -n "qihoo_360t6m" .config || (echo "ERROR: Device not enabled in .config" && exit 1)
          echo "=== All checks passed ==="

      - name: Check uImage compression options
        run: |
          echo "=== Searching for uImage compression definitions ==="
          grep -rn "uImage/none\|uimage.*none\|IMAGE_KERNEL.*none" include/ scripts/ 2>/dev/null | head -20
          echo "=== Searching for uImage macro definition ==="
          grep -n "define Build/uImage" -A 15 include/image-commands.mk 2>/dev/null

      - name: Build Firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware
          path: |
            bin/targets/**/*
      - name: Build Firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware
          path: |
            bin/targets/**/*
