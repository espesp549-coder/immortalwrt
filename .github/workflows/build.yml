name: Build ImmortalWrt for 360T6M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Verify Branch
        run: |
          git branch --show-current
          git log -1 --oneline

      - name: Fix Ubuntu APT Mirrors
        run: |
          echo "===== BEFORE MIRROR FIX ====="
          grep -R "azure.archive.ubuntu.com" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true

          sudo sed -i \
            's|azure.archive.ubuntu.com/ubuntu|archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list 2>/dev/null || true

          sudo find /etc/apt/sources.list.d -type f \
            \( -name "*.list" -o -name "*.sources" \) \
            -exec sed -i \
            's|azure.archive.ubuntu.com/ubuntu|archive.ubuntu.com/ubuntu|g' {} \; \
            2>/dev/null || true

          echo "===== AFTER MIRROR FIX ====="
          grep -R "archive.ubuntu.com/ubuntu\|azure.archive.ubuntu.com" \
            /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true

      - name: Initialization Environment
        timeout-minutes: 10
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /var/lib/apt/lists/partial

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            build-essential \
            libncurses5-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            xsltproc \
            zlib1g-dev \
            ecj \
            fastjar \
            java-common \
            libelf-dev \
            libfuse-dev \
            libsnmp-dev \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            unzip \
            zstd \
            file \
            wget \
            ccache \
            cmake

          echo "===== BUILD ENVIRONMENT READY ====="
          gcc --version | head -n 1
          make --version | head -n 1
          df -h

      - name: Download packages & Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify Corrected DTS Exists
        run: |
          DTS="target/linux/ramips/dts/mt7621_qihoo_360t6m_fixed_corrected.dts"

          echo "======================================"
          echo "CHECKING CORRECTED DTS"
          echo "======================================"

          if [ ! -f "$DTS" ]; then
            echo "ERROR: Corrected DTS not found:"
            echo "$DTS"
            echo
            echo "Available 360T6M DTS files:"
            find target/linux/ramips/dts -maxdepth 1 -type f \
              -iname '*360t6m*' -print
            exit 1
          fi

          echo "FOUND:"
          ls -lh "$DTS"

          echo
          echo "===== DTS PCIe / RESET CONTENT ====="
          grep -n -A40 -B10 \
            -E 'pcie@1e140000|reset-names|resets =|mt7915|wifi' \
            "$DTS" || true

      - name: Verify Corrected DTS Syntax
        run: |
          DTS="target/linux/ramips/dts/mt7621_qihoo_360t6m_fixed_corrected.dts"

          test -f "$DTS"

          echo "===== DTS FILE ====="
          wc -l "$DTS"
          sha256sum "$DTS"

          echo
          echo "===== IMPORTANT DTS LABELS ====="
          grep -n "rstctrl" "$DTS" || true
          grep -n "pcie@1e140000" "$DTS" || true
          grep -n "reset-names" "$DTS" || true
          grep -n "resets =" "$DTS" || true

      - name: Inject 360T6M Device Definition
        run: |
          FILE="target/linux/ramips/image/mt7621.mk"

          sed -i '/define Device\/360_t6m/,/endef/d' "$FILE"
          sed -i '/TARGET_DEVICES += 360_t6m/d' "$FILE"

          cat << 'EOF' >> "$FILE"

          define Device/360_t6m
            $(Device/nand)
            DEVICE_VENDOR := 360
            DEVICE_MODEL := T6M
            DEVICE_DTS := mt7621_qihoo_360t6m_fixed_corrected
            SOC := mt7621
            KERNEL_SIZE := 4096k
            IMAGE_SIZE := 124416k
            BLOCKSIZE := 128k
            PAGESIZE := 2048
            KERNEL_LOADADDR := 0x80001000
            KERNEL := kernel-bin | append-dtb | lzma | uImage lzma
            DEVICE_PACKAGES := kmod-mt76-connac kmod-mt76-core kmod-mt7915-firmware kmod-mt7915e kmod-tun kmod-nft-tproxy wpad-openssl luci luci-ssl dropbear
            IMAGES += factory.bin
            IMAGE/factory.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          endef

          TARGET_DEVICES += 360_t6m
          EOF

          echo "===== DEVICE DEFINITION ====="
          grep -n -A30 "define Device/360_t6m" "$FILE"

      - name: Configure Network
        run: |
          mkdir -p files/etc/config

          cat << 'EOF' > files/etc/config/network
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

          config globals 'globals'
              option ula_prefix 'fd00::/64'

          config interface 'lan'
              option device 'eth0'
              option proto 'static'
              option ipaddr '192.168.1.1'
              option netmask '255.255.255.0'
          EOF

      - name: Configure SSH
        run: |
          mkdir -p files/etc

          cat << 'EOF' > files/etc/rc.local
          #!/bin/sh

          ip link set eth0 up 2>/dev/null || true
          ip addr add 192.168.1.1/24 dev eth0 2>/dev/null || true

          exit 0
          EOF

          chmod +x files/etc/rc.local

      - name: Configure Kernel Reset Controller
        run: |
          for cfg in target/linux/ramips/mt7621/config-*; do
            if [ -f "$cfg" ]; then

              grep -q '^CONFIG_RESET_CONTROLLER=' "$cfg" || \
                echo 'CONFIG_RESET_CONTROLLER=y' >> "$cfg"

              grep -q '^CONFIG_RESET_MT7621=' "$cfg" || \
                echo 'CONFIG_RESET_MT7621=y' >> "$cfg"

              grep -q '^CONFIG_MFD_SYSCON=' "$cfg" || \
                echo 'CONFIG_MFD_SYSCON=y' >> "$cfg"

            fi
          done

      - name: Load Custom Config
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y
          CONFIG_LEGACY_IMAGE_FORMAT=y

          CONFIG_RESET_CONTROLLER=y
          CONFIG_RESET_MT7621=y
          CONFIG_MFD_SYSCON=y

          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y

          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y

          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_wpad-openssl=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_dropbear=y
          EOF

          make defconfig

      - name: Final DTS Verification
        run: |
          DTS="target/linux/ramips/dts/mt7621_qihoo_360t6m_fixed_corrected.dts"

          echo "=============================================="
          echo "FINAL DTS USED FOR BUILD"
          echo "=============================================="
          echo "$DTS"

          test -f "$DTS"

          echo
          echo "===== PCIe ====="
          grep -n -A45 -B10 "pcie@1e140000" "$DTS" || true

          echo
          echo "===== RESET ====="
          grep -n "resets =" "$DTS" || true
          grep -n "reset-names" "$DTS" || true

          echo
          echo "===== MT7915 ====="
          grep -n -A15 -B10 "mt7915" "$DTS" || true

      - name: Download package sources
        timeout-minutes: 20
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        timeout-minutes: 60
        run: |
          make -j$(nproc) V=s

      - name: Verify Firmware
        if: success()
        run: |
          echo "======================================"
          echo "FIRMWARE BUILD SUCCESSFUL"
          echo "======================================"

          find bin/targets/ramips/mt7621/ \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-360T6M-Corrected-DTS-${{ github.run_number }}
          path: |
            bin/targets/ramips/mt7621/*360*
