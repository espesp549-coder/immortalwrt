name: Build ImmortalWrt 23.05.0 for 360T6M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. Checkout YOUR fork / current repository
      # =========================================================
      - name: Checkout ImmortalWrt 23.05.0
        uses: actions/checkout@v4
        with:
          ref: 23.05.0
          fetch-depth: 1

      # =========================================================
      # 2. Install build dependencies
      # =========================================================
      - name: Install Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time

      # =========================================================
      # 3. Verify source and DTS
      # =========================================================
      - name: Verify 360T6M DTS
        run: |
          set -e

          DTS="target/linux/ramips/dts/mt7621_qihoo_360t6m.dts"

          echo "===== SOURCE ====="
          git branch --show-current
          git rev-parse HEAD

          echo
          echo "===== CHECK DTS ====="

          if [ ! -f "$DTS" ]; then
            echo "ERROR: DTS not found:"
            echo "$DTS"
            echo
            echo "Available Qihoo DTS files:"
            find target/linux/ramips/dts -iname '*360*' -o -iname '*qihoo*' || true
            exit 1
          fi

          echo "DTS FOUND:"
          ls -lh "$DTS"

          echo
          echo "===== DTS DEVICE INFO ====="
          grep -n -E 'compatible|model|360|T6M' "$DTS" || true

          echo
          echo "===== DTS PCIe SECTION ====="
          grep -n -A80 -B10 'pcie@1e140000' "$DTS" || true

      # =========================================================
      # 4. Update feeds
      # =========================================================
      - name: Update Feeds
        run: |
          set -e

          ./scripts/feeds update -a

      # =========================================================
      # 5. Install feeds
      # =========================================================
      - name: Install Feeds
        run: |
          set -e

          ./scripts/feeds install -a

      # =========================================================
      # 6. Create minimal configuration
      # =========================================================
      - name: Configure 360T6M
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y

          CONFIG_LEGACY_IMAGE_FORMAT=y

          # UBI / UBIFS
          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y

          # TPROXY / TUN
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y

          # WiFi - MediaTek MT7915
          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_wpad-openssl=y

          # Basic packages
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_dropbear=y
          EOF

          echo "===== INITIAL CONFIG ====="
          cat .config

      # =========================================================
      # 7. Generate final configuration
      # =========================================================
      - name: Run Defconfig
        run: |
          set -e

          make defconfig

          echo
          echo "===== TARGET CONFIG ====="
          grep -E \
            'CONFIG_TARGET_ramips=|CONFIG_TARGET_ramips_mt7621=|CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=' \
            .config || true

          echo
          echo "===== PACKAGE CONFIG ====="
          grep -E \
            'CONFIG_PACKAGE_(kmod-nft-tproxy|kmod-tun|iptables-nft|kmod-mt76-connac|kmod-mt76-core|kmod-mt7915-firmware|kmod-mt7915e|wpad-openssl|luci|luci-ssl|dropbear)=' \
            .config || true

      # =========================================================
      # 8. Verify target profile was accepted
      # =========================================================
      - name: Verify Target Profile
        run: |
          set -e

          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_BOARD=' .config
          grep '^CONFIG_TARGET_SUBTARGET=' .config
          grep '^CONFIG_TARGET_PROFILE=' .config

          PROFILE="$(grep '^CONFIG_TARGET_PROFILE=' .config | cut -d'"' -f2)"

          echo
          echo "Selected profile:"
          echo "$PROFILE"

          if [ "$PROFILE" != "DEVICE_360_t6m" ]; then
            echo
            echo "ERROR: 360T6M target profile was NOT selected."
            echo "The DTS exists, but the target device definition may be missing."
            exit 1
          fi

      # =========================================================
      # 9. Clean build
      # =========================================================
      - name: Clean Build
        run: |
          make clean

      # =========================================================
      # 10. Re-apply configuration after clean
      # =========================================================
      - name: Restore Configuration
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y

          CONFIG_LEGACY_IMAGE_FORMAT=y

          # UBI / UBIFS
          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y

          # TPROXY / TUN
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y

          # WiFi
          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7915-firmware=y
          CONFIG_PACKAGE_kmod-mt7915e=y
          CONFIG_PACKAGE_wpad-openssl=y

          # Basic
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_dropbear=y
          EOF

          make defconfig

      # =========================================================
      # 11. Build firmware
      # =========================================================
      - name: Build Firmware
        run: |
          set -e

          echo "===== BUILD START ====="

          make -j$(nproc) V=s

      # =========================================================
      # 12. Show generated images
      # =========================================================
      - name: List Firmware
        run: |
          echo "===== GENERATED FIRMWARE ====="

          find bin/targets/ramips/mt7621 \
            -maxdepth 2 \
            -type f \
            \( -name '*.bin' -o -name '*.ubi' -o -name '*.itb' -o -name '*.img' \) \
            -print \
            -exec ls -lh {} \;

      # =========================================================
      # 13. Upload firmware
      # =========================================================
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-23.05.0-360T6M
          path: |
            bin/targets/ramips/mt7621/*.bin
            bin/targets/ramips/mt7621/*.ubi
            bin/targets/ramips/mt7621/*.itb
            bin/targets/ramips/mt7621/*.img
            bin/targets/ramips/mt7621/sha256sums
          if-no-files-found: error
