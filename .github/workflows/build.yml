name: Build ImmortalWrt 23.05 for Qihoo 360T6M

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/espesp549-coder/immortalwrt
  REPO_BRANCH: openwrt-23.05
  TZ: Asia/Baghdad

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install build-essential clang flex bison gstreamer1.0-plugins-base gstreamer1.0-tools libffi-dev libgdk-pixbuf2.0-dev libglib2.0-dev libgmp-dev libltdl-dev libncurses-dev libncurses5-dev libpcap-dev libpcre3-dev libssl-dev libxml2-dev openssl python3-dev python3-setuptools rsync subversion swig time xsltproc zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone ImmortalWrt Source
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      working-directory: /workdir/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy Custom Files from Your Repo Paths
      working-directory: /workdir/openwrt
      run: |
        # نسخ ملف الـ DTS وتسميته بالشكل الذي يطابق تعريف الجهاز
        cp $GITHUB_WORKSPACE/immortalwrt/target/linux/ramips/dts/t6m.dts target/linux/ramips/dts/t6m.dts
        
        # نسخ ملف تعريف الجهاز
        cp $GITHUB_WORKSPACE/immortalwrt/target/linux/ramips/image/mt7621.mk target/linux/ramips/image/mt7621.mk
        
        # نسخ ملف الـ Config
        cp $GITHUB_WORKSPACE/immortalwrt/config.seed .config
        
        make defconfig

    - name: Download Packages
      working-directory: /workdir/openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: /workdir/openwrt
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_360T6M_Uncompressed
        path: |
          /workdir/openwrt/bin/targets/ramips/mt7621/*.bin
          /workdir/openwrt/bin/targets/ramips/mt7621/manifest
          
