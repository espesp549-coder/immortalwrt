name: Build Optimized ImmortalWrt 23.05.7 for 360T6M

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_TAG: v23.05.7
  TARGET: ramips
  SUBTARGET: mt7621
  DEVICE_PKG: 360_t6m
  DTS_FILE: mt7621_qihoo_360t6m.dts
  MK_SNIPPET: 360_t6m.mk

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout customization repo (files/)
        uses: actions/checkout@v4

      - name: Setup swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget curl xsltproc libelf-dev \
            libfuse-dev libsnmp-dev swig ccache cmake zstd

      - name: Clone ImmortalWrt source (${{ env.REPO_TAG }})
        run: |
          git clone --branch openwrt-23.05 --single-branch --depth 1 $REPO_URL openwrt
          cd openwrt
          git fetch --depth 1 origin tag $REPO_TAG
          git checkout $REPO_TAG
          echo "===== SOURCE ====="
          git log -1 --oneline

      - name: Cache toolchain build directories
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ env.REPO_TAG }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('openwrt/include/kernel-*.mk', 'openwrt/toolchain/**') }}
          restore-keys: |
            toolchain-${{ env.REPO_TAG }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-

      - name: Cache downloaded package sources
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.REPO_TAG }}-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            dl-${{ env.REPO_TAG }}-

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject custom DTS
        run: |
          DTS_SRC="files/$DTS_FILE"
          if [ ! -f "$DTS_SRC" ]; then
            echo "ERROR: $DTS_SRC not found in repo — upload it under files/ first."
            exit 1
          fi
          cp "$DTS_SRC" openwrt/target/linux/ramips/dts/
          echo "DTS copied:"
          ls -lh "openwrt/target/linux/ramips/dts/$DTS_FILE"

      - name: Inject Custom Network, Board Config & Dynamic MAC Fix
        run: |
          mkdir -p openwrt/files/etc
          
          # 1. تحديث board.json بتعريف دقيق ومضبوط لمنافذ الـ DSA الخاصة بالـ 360T6M
          cat << 'EOF' > openwrt/files/etc/board.json
          {
                  "model": {
                          "id": "360,360t6m",
                          "name": "360T6M"
                  },
                  "network": {
                          "lan": {
                                  "device": "eth0",
                                  "ports": [ "lan1", "lan2", "lan3" ],
                                  "protocol": "static"
                          },
                          "wan": {
                                  "device": "wan",
                                  "protocol": "dhcp"
                          }
                  },
                  "system": {
                          "compat_version": "1.1"
                  }
          }
          EOF

          # 2. حقن إعدادات الشبكة بنظام DSA السليم
          mkdir -p openwrt/files/etc/config
          cat << 'EOF' > openwrt/files/etc/config/network
          config interface 'loopback'
                  option device 'lo'
                  option proto 'static'
                  option ipaddr '127.0.0.1'
                  option netmask '255.0.0.0'

          config globals 'globals'
                  option ula_prefix 'fd37:ec3a:dd00::/48'
                  option packet_steering '1'

          config device
                  option name 'br-lan'
                  option type 'bridge'
                  list ports 'lan1'
                  list ports 'lan2'
                  list ports 'lan3'

          config interface 'lan'
                  option device 'br-lan'
                  option proto 'static'
                  option ipaddr '192.168.1.1'
                  option netmask '255.255.255.0'
                  option ip6assign '60'

          config interface 'wan'
                  option device 'wan'
                  option proto 'dhcp'

          config interface 'wan6'
                  option device 'wan'
                  option proto 'dhcpv6'
          EOF

          # 3. سكربت توليد الماك أدرس العشوائي الفريد لمنع التضارب
          mkdir -p openwrt/files/etc/uci-defaults
          cat << 'EOF' > openwrt/files/etc/uci-defaults/99_generate_mac
          #!/bin/sh
          if [ -f /etc/config/network ]; then
              RAND_MAC="d2:$(hexdump -n 5 -e '/1 "%02x:"' /dev/urandom | sed 's/:$//')"
              uci set network.lan.macaddr="$RAND_MAC"
              uci commit network
          fi
          exit 0
          EOF
          chmod +x openwrt/files/etc/uci-defaults/99_generate_mac

          echo "Fixed DSA board.json and network configuration injected successfully."

      - name: Verify Injected Files & Configurations (تحقق شامل)
        run: |
          echo "===== 1. Verify board.json ====="
          if [ -f "openwrt/files/etc/board.json" ]; then
            echo "board.json exists successfully."
            cat openwrt/files/etc/board.json
          else
            echo "ERROR: board.json is missing!"
            exit 1
          fi

          echo -e "\n===== 2. Verify network config ====="
          if [ -f "openwrt/files/etc/config/network" ]; then
            echo "network config exists successfully."
          else
            echo "ERROR: network config is missing!"
            exit 1
          fi

          echo -e "\n===== 3. Verify MAC generator script ====="
          if [ -f "openwrt/files/etc/uci-defaults/99_generate_mac" ] && [ -x "openwrt/files/etc/uci-defaults/99_generate_mac" ]; then
            echo "MAC generator script exists and is executable."
          else
            echo "ERROR: MAC generator script is missing or not executable!"
            exit 1
          fi

      - name: Inject device definition into mt7621.mk
        run: |
          MK_SRC="files/$MK_SNIPPET"
          if [ ! -f "$MK_SRC" ]; then
            echo "ERROR: $MK_SRC not found in repo — upload it under files/ first."
            exit 1
          fi
          cd openwrt
          MK=target/linux/ramips/image/mt7621.mk
          if grep -q "Device/${DEVICE_PKG}" "$MK"; then
            echo "Device/${DEVICE_PKG} already defined in $MK — skipping append."
          else
            echo "" >> "$MK"
            cat "../$MK_SRC" >> "$MK"
            echo "Appended device block to $MK"
          fi

      - name: Inject Performance & CPU Optimizations (sysctl.conf)
        run: |
          mkdir -p openwrt/files/etc
          cat << 'EOF' > openwrt/files/etc/sysctl.conf
          vm.swappiness=10
          vm.vfs_cache_pressure=50
          net.core.netdev_max_backlog = 10000
          net.core.somaxconn = 1024
          net.ipv4.tcp_max_syn_backlog = 8192
          net.ipv4.tcp_fin_timeout = 15
          net.ipv4.tcp_tw_reuse = 1
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.ipv4.tcp_rmem = 4096 87380 16777216
          net.ipv4.tcp_wmem = 4096 65536 16777216
          EOF
          echo "Performance sysctl.conf injected successfully."

      - name: Verify device + DTS registration
        run: |
          cd openwrt
          echo "===== DEVICE BLOCK ====="
          grep -n "360_t6m" target/linux/ramips/image/mt7621.mk || { echo "NOT FOUND — build will fail"; exit 1; }
          echo
          echo "===== DTS PRESENT ====="
          ls -lh target/linux/ramips/dts/mt7621_qihoo_360t6m.dts

      - name: Generate .config with CPU, Kernel & WireGuard Optimizations
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y
          CONFIG_CC_OPTIMIZE_FOR_SIZE=y
          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          EOF
          make defconfig

      - name: Verify final configuration
        run: |
          cd openwrt
          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_' .config | grep -E 'ramips|mt7621|360_t6m' || { echo "WARNING: device profile not enabled"; exit 1; }
          echo "===== WIREGUARD CONFIG ====="
          grep 'WIREGUARD' .config || { echo "WARNING: WireGuard options missing"; exit 1; }

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Verify built firmware path & files
        run: |
          TARGET_DIR="openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}"
          echo "Checking firmware output directory: $TARGET_DIR"
          if [ -d "$TARGET_DIR" ]; then
            echo "Directory exists. Contents:"
            ls -lh "$TARGET_DIR"
            if ls "$TARGET_DIR"/*360t6m* 1> /dev/null 2>&1; then
              echo "Firmware bin file for 360T6M generated successfully!"
            else
              echo "ERROR: 360T6M bin file not found in output directory!"
              exit 1
            fi
          else
            echo "ERROR: Firmware output directory does not exist!"
            exit 1
          fi

      - name: List firmware
        if: success()
        run: |
          find openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/ -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Optimized-ImmortalWrt-23.05.7-360T6M-${{ github.run_number }}
          path: openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*
          if-no-files-found: error
          
