name: Build ImmortalWrt for Qihoo 360T6M

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/espesp549-coder/immortalwrt
  REPO_BRANCH: master
  TZ: Asia/Baghdad

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install build-essential clang flex bison gstreamer1.0-plugins-base gstreamer1.0-tools libffi-dev libgdk-pixbuf2.0-dev libglib2.0-dev libgmp-dev libltdl-dev libncurses-dev libncurses5-dev libpcap-dev libpcre3-dev libssl-dev libxml2-dev openssl python3-dev python3-setuptools rsync subversion swig time xsltproc zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone Custom ImmortalWrt Source
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      working-directory: /workdir/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Link Fixed DTS to Build System Target
      working-directory: /workdir/openwrt
      run: |
        echo "Linking custom DTS file..."
        cp target/linux/ramips/dts/mt7621_qihoo_360t6m_fixed.dts target/linux/ramips/dts/mt7621_qihoo_360t6m.dts
        echo "Custom DTS applied successfully!"

    - name: Generate Config for 360T6M
      working-directory: /workdir/openwrt
      run: |
        echo "CONFIG_TARGET_ramips=y" > .config
        echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
        echo "CONFIG_TARGET_ramips_mt7621_DEVICE_360_360t6m=y" >> .config
        echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> .config
        echo "CONFIG_PACKAGE_kmod-mt76-core=y" >> .config
        make defconfig

    - name: Download Packages
      working-directory: /workdir/openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: /workdir/openwrt
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_360T6M_Fixed
        path: /workdir/openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin
        
