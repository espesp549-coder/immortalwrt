name: Build ImmortalWrt 24.10.5 for 360T6M

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_TAG: v24.10.5
  TARGET: ramips
  SUBTARGET: mt7621
  DEVICE_PKG: 360_t6m
  DTS_FILE: mt7621_qihoo_360t6m.dts
  MK_SNIPPET: 360_t6m.mk

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout customization repo (files/)
        uses: actions/checkout@v4

      - name: Setup swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget curl xsltproc libelf-dev \
            libfuse-dev libsnmp-dev swig ccache cmake zstd

      - name: Clone ImmortalWrt source (${{ env.REPO_TAG }})
        run: |
          git clone --branch openwrt-24.10 --single-branch --depth 1 $REPO_URL openwrt
          cd openwrt
          git fetch --depth 1 origin tag $REPO_TAG
          git checkout $REPO_TAG
          echo "===== SOURCE ====="
          git log -1 --oneline

      - name: Cache toolchain build directories
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/toolchain-*
          key: toolchain-${{ env.REPO_TAG }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ hashFiles('openwrt/include/kernel-*.mk', 'openwrt/toolchain/**') }}
          restore-keys: |
            toolchain-${{ env.REPO_TAG }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-

      - name: Cache downloaded package sources
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.REPO_TAG }}-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            dl-${{ env.REPO_TAG }}-

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject custom DTS
        run: |
          DTS_SRC=$(find . -maxdepth 3 -iname "$DTS_FILE" -not -path "./openwrt/*" | head -1)
          if [ -z "$DTS_SRC" ]; then
            echo "ERROR: $DTS_FILE not found anywhere in repo — upload it first."
            exit 1
          fi
          echo "Found DTS at: $DTS_SRC"
          cp "$DTS_SRC" openwrt/target/linux/ramips/dts/
          echo "DTS copied successfully."

      - name: Inject device definition into mt7621.mk
        run: |
          MK_SRC=$(find "$(pwd)" -maxdepth 3 -iname "$MK_SNIPPET" -not -path "*/openwrt/*" | head -1)
          if [ -z "$MK_SRC" ]; then
            echo "ERROR: $MK_SNIPPET not found anywhere in repo — upload it first."
            exit 1
          fi
          echo "Found MK snippet at: $MK_SRC"
          cd openwrt
          MK=target/linux/ramips/image/mt7621.mk
          if grep -q "Device/${DEVICE_PKG}" "$MK"; then
            echo "Device/${DEVICE_PKG} already defined in $MK — skipping append."
          else
            echo "" >> "$MK"
            cat "$MK_SRC" >> "$MK"
            echo "Appended device block to $MK"
          fi

      - name: Inject Custom Files (board.json, network config, wireless config, and boot script)
        run: |
          FILES_DIR=$(find . -maxdepth 2 -type d -name "files" -not -path "./openwrt*" | head -1)
          if [ -n "$FILES_DIR" ]; then
            echo "Found files directory at: $FILES_DIR"
            cp -r "$FILES_DIR" openwrt/
          else
            echo "Creating openwrt/files directory..."
            mkdir -p openwrt/files
          end_if_missing=""
          fi

          # 1. Inject board.json for DSA ports mapping
          mkdir -p openwrt/files/etc
          cat << 'EOF' > openwrt/files/etc/board.json
          {
                  "model": {
                          "id": "360,360t6m",
                          "name": "360T6M"
                  },
                  "network": {
                          "lan": {
                                  "ports": [ "lan1", "lan2", "lan3" ],
                                  "protocol": "static"
                          },
                          "wan": {
                                  "device": "wan",
                                  "protocol": "dhcp"
                          }
                  },
                  "system": {
                          "compat_version": "1.1"
                  }
          }
          EOF

          # 2. Inject explicit network config
          mkdir -p openwrt/files/etc/config
          cat << 'EOF' > openwrt/files/etc/config/network
          config interface 'loopback'
          	option device 'lo'
          	option proto 'static'
          	option ipaddr '127.0.0.1'
          	option netmask '255.0.0.0'

          config globals 'globals'
          	option ula_prefix 'fd37:ec3a:dd00::/48'
          	option packet_steering '1'

          config device
          	option name 'br-lan'
          	option type 'bridge'
          	list ports 'lan1'
          	list ports 'lan2'
          	list ports 'lan3'

          config interface 'lan'
          	option device 'br-lan'
          	option proto 'static'
          	option ipaddr '192.168.1.1'
          	option netmask '255.255.255.0'
          	option ip6assign '60'

          config interface 'wan'
          	option device 'wan'
          	option proto 'dhcp'

          config interface 'wan6'
          	option device 'wan'
          	option proto 'dhcpv6'
          EOF

          # 3. Inject explicit wireless config for 2.4G and 5G broadcasting
          cat << 'EOF' > openwrt/files/etc/config/wireless
          config wifi-device 'radio0'
          	option type 'mac80211'
          	option path 'platform/1e140000.pcie/pci0000:00/0000:00:00.0'
          	option band '2g'
          	option channel '1'
          	option htmode 'HT20'
          	option disabled '0'
          	option country 'IQ'

          config wifi-iface 'default_radio0'
          	option device 'radio0'
          	option network 'lan'
          	option mode 'ap'
          	option ssid 'OpenWrt_24_Ali'
          	option encryption 'psk2'
          	option key '12345678'

          config wifi-device 'radio1'
          	option type 'mac80211'
          	option path 'platform/1e140000.pcie/pci0000:00/0000:01:00.0'
          	option band '5g'
          	option channel '36'
          	option htmode 'VHT80'
          	option disabled '0'
          	option country 'IQ'

          config wifi-iface 'default_radio1'
          	option device 'radio1'
          	option network 'lan'
          	option mode 'ap'
          	option ssid 'OpenWrt_24_Ali_5G'
          	option encryption 'psk2'
          	option key '12345678'
          EOF

          # 4. Inject boot script to force bring up interfaces on first boot
          mkdir -p openwrt/files/etc/init.d
          cat << 'EOF' > openwrt/files/etc/init.d/ports_up
          #!/bin/sh /etc/rc.common

          START=99
          boot() {
              ip link set lan1 up 2>/dev/null || true
              ip link set lan2 up 2>/dev/null || true
              ip link set lan3 up 2>/dev/null || true
              ip link set wan up 2>/dev/null || true
          }
          EOF
          chmod +x openwrt/files/etc/init.d/ports_up

          echo "Successfully injected board.json, network, wireless configs and ports_up script."

      - name: Verify device + DTS registration
        run: |
          cd openwrt
          echo "===== DEVICE BLOCK ====="
          grep -n "360_t6m" target/linux/ramips/image/mt7621.mk || echo "NOT FOUND — build will fail"
          echo
          echo "===== DTS PRESENT ====="
          ls -lh target/linux/ramips/dts/mt7621_qihoo_360t6m.dts

      - name: Generate .config
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_360_t6m=y

          # UBI/UBIFS support
          CONFIG_MTD_UBI=y
          CONFIG_MTD_UBI_BEB_LIMIT=20
          CONFIG_MTD_UBI_FASTMAP=y
          CONFIG_UBIFS_FS=y

          # Netfilter kernel options for TProxy
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_SOCKET=y
          CONFIG_NF_CONNTRACK_MARK=y

          # Wi-Fi Drivers & OpenSSL backend for 24.10 architecture compatibility
          CONFIG_PACKAGE_kmod-mt7603=y
          CONFIG_PACKAGE_kmod-mt7615=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_wireless-tools=y
          EOF
          make defconfig

      - name: Verify final configuration
        run: |
          cd openwrt
          echo "===== TARGET ====="
          grep '^CONFIG_TARGET_' .config | grep -E 'ramips|mt7621|360_t6m' || echo "WARNING: device profile not enabled"
          echo
          echo "===== WIFI ====="
          grep -E '^CONFIG_PACKAGE_.*(mt76|wpad|iwinfo)' .config || true

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: List firmware
        if: success()
        run: |
          find openwrt/bin/targets/$TARGET/$SUBTARGET/ -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-24.10.5-360T6M-${{ github.run_number }}
          path: openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*
          if-no-files-found: error
          
