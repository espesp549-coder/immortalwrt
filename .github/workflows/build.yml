name: Build OpenWrt

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  TZ: Asia/Baghdad

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc zlib1g-dev ecj fastjar java-common libelf-dev libfuse-dev libsnmp-dev python3-setuptools rsync subversion swig unzip zstd file wget
          sudo timedatectl set-timezone "$TZ"

      - name: Clone Source Code
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt

      - name: Inject Device & Load Config
        run: |
          # 1. حقن تعريف الجهاز مباشرة داخل ملف mt7621.mk
          cat << 'EOF' >> openwrt/target/linux/ramips/image/mt7621.mk

define Device/qihoo_360t6m
  $(Device/nand)
  DEVICE_VENDOR := 360
  DEVICE_MODEL := 360T6M
  DEVICE_DTS := mt7621_qihoo_360t6m
  DEVICE_DTS_DIR := ../dts
  SOC := mt7621
  KERNEL_SIZE := 4096k
  IMAGE_SIZE := 124416k
  UBINIZE_OPTS := -E 5
  BLOCKSIZE := 128k
  PAGESIZE := 2048
  KERNEL_LOADADDR := 0x80000000
  KERNEL := kernel-bin | relocate-kernel $(loadaddr-y) | lzma | fit lzma $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb
  DEVICE_PACKAGES := kmod-mt76-connac kmod-mt76-core kmod-mt7915-firmware kmod-mt7915e kmod-tun kmod-nft-tproxy wpad-openssl luci luci-ssl dropbear
  IMAGES += factory.bin
  IMAGE/factory.bin := append-kernel | pad-to $$(KERNEL_SIZE) | append-ubi | check-size
  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
endef
TARGET_DEVICES += qihoo_360t6m
EOF

          # 2. نسخ ملف الـ .config وتحديث الحزم
          [ -e .config ] && cp .config openwrt/.config
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Verify Device Definition & Kernel LZMA
        run: |
          cd openwrt
          echo "=== Checking Makefile device definition ==="
          grep -n "qihoo_360t6m" target/linux/ramips/image/mt7621.mk || (echo "ERROR: Device not found in mt7621.mk" && exit 1)
          
          echo "=== Checking DTS file exists ==="
          ls -la target/linux/ramips/dts/mt7621_qihoo_360t6m.dts || (echo "ERROR: DTS file not found" && exit 1)
          
          echo "=== Checking .config has device enabled ==="
          grep -n "qihoo_360t6m" .config || (echo "ERROR: Device not enabled in .config" && exit 1)
          
          echo "=== Verify KERNEL uses LZMA Compression ==="
          grep "CONFIG_KERNEL_LZMA=y" .config && echo "OK: LZMA enabled in .config" || (echo "ERROR: LZMA not enabled!" && exit 1)
          
          echo "=== All checks passed ==="

      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Qihoo360T6M-${{ github.run_number }}
          path: |
            openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin
            openwrt/bin/targets/ramips/mt7621/*factory.bin
            
