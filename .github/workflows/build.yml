name: Build OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Branch
        run: |
          git branch --show-current
          git log -1 --oneline

      - name: Initialization Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext libssl-dev xsltproc zlib1g-dev ecj fastjar java-common libelf-dev libfuse-dev libsnmp-dev python3-setuptools rsync subversion swig unzip zstd file wget

      - name: Download packages & Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Config
        run: |
          [ -e config.seed ] && cp config.seed .config
          make defconfig

      - name: Verify Device Definition
        run: |
          grep -n "360_t6m" target/linux/ramips/image/mt7621.mk || (echo "ERROR: Device not found" && exit 1)
          ls -la target/linux/ramips/dts/mt7621_qihoo_360t6m.dts || (echo "ERROR: DTS not found" && exit 1)
          grep -n "360_t6m" .config || (echo "ERROR: Device not enabled" && exit 1)
          grep -A15 "define Device/360_t6m" target/linux/ramips/image/mt7621.mk | grep -q "uImage none" && echo "OK: uImage none confirmed" || (echo "ERROR: wrong kernel format!" && exit 1)

      - name: Deep UBI Configuration Trace
        run: |
          echo "=== Device/nand macro ==="
          grep -A 30 "^define Device/nand" include/nand.mk 2>/devnull || find . -name "nand.mk" -exec grep -A 30 "^define Device/nand" {} \;
          echo "=== UBI config after defconfig ==="
          grep "CONFIG_MTD_UBI\|CONFIG_UBIFS" .config || echo "WARNING: missing"

      - name: Download package sources
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        run: |
          make -j$(nproc) V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware-${{ github.run_number }}
          path: |
            bin/targets/ramips/mt7621/*360*
            
